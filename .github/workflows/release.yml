name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (beta -> Open Testing & TestFlight, production -> Play Store & App Store)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production
      version_name:
        description: 'Version name to build (e.g. 8.1.0-beta.1 or 8.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build, sign, and validate Play Store / iOS archive without publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare & Validate Release
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.meta.outputs.track }}
      is_beta: ${{ steps.meta.outputs.is_beta }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version_name: ${{ steps.meta.outputs.version_name }}
      ios_marketing_version: ${{ steps.meta.outputs.ios_marketing_version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute and validate release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          # 1. Determine track (beta vs production)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRACK="$INPUT_TRACK"
            RAW_VERSION="$INPUT_VERSION_NAME"
          else
            RAW_VERSION="$RELEASE_TAG"
            if [ "$RELEASE_PRERELEASE" = "true" ] || [[ "$RELEASE_TAG" == *-* ]]; then
              TRACK="beta"
            else
              TRACK="production"
            fi
          fi

          if [ "$TRACK" = "beta" ]; then
            IS_BETA="true"
          else
            IS_BETA="false"
          fi

          VERSION_NAME="${RAW_VERSION#v}"
          if [ "$TRACK" = "beta" ] && [[ "$VERSION_NAME" != *-* ]]; then
            VERSION_NAME="${VERSION_NAME}-beta.${RUN_NUMBER}"
          fi
          TAG_NAME="${RELEASE_TAG:-v${VERSION_NAME}}"
          IOS_MARKETING_VERSION="${VERSION_NAME%%-*}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN="true"
          else
            DRY_RUN="false"
          fi

          # 2. Pre-flight check: prevent workflow_dispatch (non-dry-run) from colliding with an existing release or draft
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "false" ]; then
            EXISTING_MATCH=$(gh release list --limit 50 --json tagName,isDraft --jq ".[] | select(.tagName == \"$TAG_NAME\") | .tagName" || true)
            if [ -n "$EXISTING_MATCH" ]; then
              echo "::error::GitHub Release (or pending draft) for $TAG_NAME already exists. Publish the existing draft or choose a new version_name."
              exit 1
            fi
          fi

          # 3. Pre-flight check: verify all required secrets are configured before any platform job starts
          MISSING_SECRETS=()
          for SECRET_VAR in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GOOGLE_PLAY_JSON_KEY \
            IOS_DIST_CERT_BASE64 \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_KEY_P8_BASE64; do
            if [ -z "${!SECRET_VAR:-}" ]; then
              MISSING_SECRETS+=("$SECRET_VAR")
            fi
          done
          if [ "${#MISSING_SECRETS[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${MISSING_SECRETS[*]} (see docs/RELEASING.md)"
            exit 1
          fi

          # 4. Pre-flight check: verify non-empty changelog exists for both Android and iOS
          # Keep candidate filenames in sync with `read_plain_changelog` in `fastlane/Fastfile`.
          for DIR in "app/src/main/assets/changelog" "iosApp/wled/changelog"; do
            if [ ! -s "${DIR}/${VERSION_NAME}.md" ] && \
               [ ! -s "${DIR}/v${VERSION_NAME}.md" ] && \
               [ ! -s "${DIR}/${IOS_MARKETING_VERSION}.md" ] && \
               [ ! -s "${DIR}/v${IOS_MARKETING_VERSION}.md" ] && \
               [ ! -s "${DIR}/dev.md" ]; then
              echo "::error::No non-empty changelog found in ${DIR} for ${VERSION_NAME} (or dev.md)."
              exit 1
            fi
          done

          # 5. Compute monotonically increasing versionCode / CFBundleVersion (base offset 100 + workflow run_number).
          # Note: github.run_number is tied to this workflow file ID; do not rename/delete release.yml without
          # updating the base offset, and use "Re-run failed jobs" rather than "Re-run all jobs" on partial failures.
          VERSION_CODE=$((100 + RUN_NUMBER))

          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "ios_marketing_version=$IOS_MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

          {
            echo "### Release Metadata"
            echo "- **Track:** \`$TRACK\`"
            echo "- **Dry Run:** \`$DRY_RUN\`"
            echo "- **Tag:** \`$TAG_NAME\`"
            echo "- **Android Version Name:** \`$VERSION_NAME\`"
            echo "- **iOS Marketing Version:** \`$IOS_MARKETING_VERSION\`"
            echo "- **Build Number / Version Code:** \`$VERSION_CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-android:
    name: Build & Deploy Android (Play Store + GitHub APK)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Promote dev.md changelog in build workspace if needed
        if: needs.prepare.outputs.is_beta == 'false'
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.ios_marketing_version }}
        run: |
          CHANGELOG_DIR="app/src/main/assets/changelog"
          if [ -f "$CHANGELOG_DIR/dev.md" ] && [ ! -f "$CHANGELOG_DIR/${MARKETING_VERSION}.md" ]; then
            echo "::warning::dev.md was not renamed before tagging; promoting dev.md -> ${MARKETING_VERSION}.md for this build."
            mv "$CHANGELOG_DIR/dev.md" "$CHANGELOG_DIR/${MARKETING_VERSION}.md"
          fi

      - name: Decode Android Keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release AAB & APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Deploy to Google Play Store via Fastlane
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PLAY_STORE_TRACK: ${{ needs.prepare.outputs.track }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: bundle exec fastlane android deploy

      - name: Package APK & Attach to GitHub Release (IzzyOnDroid / Direct Download)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
          IS_BETA: ${{ needs.prepare.outputs.is_beta }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="WLED-Native-${TAG_NAME}.apk"
          SHA_TARGET="${APK_TARGET}.sha256"

          cp "$APK_SOURCE" "$APK_TARGET"
          sha256sum "$APK_TARGET" > "$SHA_TARGET"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; skipping GitHub Release creation and APK upload."
            exit 0
          fi

          # Ensure a published GitHub Release exists when triggered via workflow_dispatch
          if [ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'true')" != "false" ]; then
            if [ "$IS_BETA" = "true" ]; then
              gh release create "$TAG_NAME" \
                --target "$TARGET_SHA" \
                --title "$TAG_NAME" \
                --prerelease \
                --generate-notes
            else
              gh release create "$TAG_NAME" \
                --target "$TARGET_SHA" \
                --title "$TAG_NAME" \
                --generate-notes
            fi
          fi

          gh release upload "$TAG_NAME" "$APK_TARGET" "$SHA_TARGET" --clobber

      - name: Upload Signed Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ needs.prepare.outputs.version_name }}
          path: |
            WLED-Native-${{ needs.prepare.outputs.tag_name }}.apk
            WLED-Native-${{ needs.prepare.outputs.tag_name }}.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ steps.keystore.outputs.keystore_path }}"

  release-ios:
    name: Build & Deploy iOS (TestFlight / App Store Connect)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Promote dev.md changelog in build workspace if needed
        env:
          MARKETING_VERSION: ${{ needs.prepare.outputs.ios_marketing_version }}
          IS_BETA: ${{ needs.prepare.outputs.is_beta }}
        run: |
          # iOS CFBundleShortVersionString is strictly numeric (e.g. 8.1.0 without -beta.1),
          # so copy dev.md -> <MARKETING_VERSION>.md when missing so in-app "What's New" works on TestFlight too.
          CHANGELOG_DIR="iosApp/wled/changelog"
          if [ -f "$CHANGELOG_DIR/dev.md" ] && [ ! -f "$CHANGELOG_DIR/${MARKETING_VERSION}.md" ]; then
            if [ "$IS_BETA" = "false" ]; then
              echo "::warning::dev.md was not renamed before tagging; promoting dev.md -> ${MARKETING_VERSION}.md for this build."
              mv "$CHANGELOG_DIR/dev.md" "$CHANGELOG_DIR/${MARKETING_VERSION}.md"
            else
              cp "$CHANGELOG_DIR/dev.md" "$CHANGELOG_DIR/${MARKETING_VERSION}.md"
            fi
          fi

      - name: Assemble Shared Release XCFramework
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework
          ./gradlew --stop

      - name: Deploy iOS via Fastlane
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_TESTFLIGHT_GROUP: ${{ vars.IOS_TESTFLIGHT_GROUP || 'Beta' }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
        run: |
          if [ "${{ needs.prepare.outputs.is_beta }}" = "true" ]; then
            bundle exec fastlane ios beta
          else
            bundle exec fastlane ios release
          fi

      - name: Upload iOS Build Artifacts (IPA & dSYMs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ needs.prepare.outputs.version_name }}
          path: |
            iosApp/build/WLED.ipa
            iosApp/build/WLED.app.dSYM.zip
          if-no-files-found: ignore
          retention-days: 30
