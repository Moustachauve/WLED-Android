name: Auto Label

on:
  pull_request_target:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  auto_label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
