name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests (Android + Shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Run unit and screenshot tests
        run: ./gradlew :app:testDebugUnitTest :app:validateDebugScreenshotTest :shared:testAndroidHostTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Screenshot Diffs
        if: failure()
        id: screenshot-artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-diffs
          path: |
            app/build/reports/screenshotTest/preview/debug/
            app/build/outputs/screenshotTest-results/preview/debug/diffs/
            app/build/outputs/screenshotTest-results/preview/debug/rendered/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add Screenshot Failure Summary
        if: failure() && steps.screenshot-artifact.outputs.artifact-url != ''
        run: |
          echo "### Screenshot Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Download [\`screenshot-test-diffs\`](${{ steps.screenshot-artifact.outputs.artifact-url }}) to inspect the HTML diff report and rendered/diff PNGs." >> "$GITHUB_STEP_SUMMARY"

  test-ios:
    name: Run Unit Tests & Build (iOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Run iOS unit tests & Assemble XCFramework
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :shared:iosSimulatorArm64Test :shared:assembleSharedDebugXCFramework
          else
            ./gradlew :shared:iosSimulatorArm64Test :shared:assembleSharedReleaseXCFramework
          fi
          ./gradlew --stop

      - name: Build and Test iOS App
        run: |
          DEST=$(xcrun simctl list devices available | grep -m1 "iPhone " | sed -E 's/^[[:space:]]*(iPhone [^()]+).*/platform=iOS Simulator,name=\1/' | xargs)
          echo "Selected destination: $DEST"
          SKIP_KMP_BUILD=1 xcodebuild test \
            -project iosApp/wled.xcodeproj \
            -scheme wled \
            -destination "$DEST" \
            -resultBundlePath iosApp/build/TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test/
            iosApp/build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Run Lint (Android + Shared)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Run Code Formatting and Quality
        run: ./gradlew spotlessCheck detekt

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
            shared/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  lint-ios:
    name: Run Lint (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config iosApp/.swiftlint.yml --strict iosApp

