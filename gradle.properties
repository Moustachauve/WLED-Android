# Gradle Daemon
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djdk.lang.Process.launchMechanism=vfork

# Kotlin Compiler Daemon
kotlin.daemon.jvmargs=-Xmx2048M -XX:+UseParallelGC
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.enableScreenshotTest=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Build Performance
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+ / Android Studio
org.gradle.tooling.parallel=true

